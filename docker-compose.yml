version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  producer:
    image: python:3.11-slim
    depends_on:
      - kafka
    volumes:
      - ./:/app
    working_dir: /app
    command: bash -c "pip install --no-cache-dir requests kafka-python && sleep 25 && python producer.py"
    restart: on-failure

  consumer:
    image: python:3.11-slim
    depends_on:
      - kafka
    volumes:
      - ./:/app
    working_dir: /app
    command: bash -c "pip install --no-cache-dir kafka-python psycopg2-binary && sleep 25 && python consumer.py"
    restart: on-failure
